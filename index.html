<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Salt Cafe & Restaurant</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,"Tahoma",sans-serif;
  background:#120b10;
  color:#fff;
  overflow-x:hidden;
}

/* NAVBAR */
nav{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
  padding:14px 20px;
  background:rgba(18,11,16,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #54253b;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:20px;
  font-weight:bold;
  color:#ff8fbd;
}

.logo span{
  color:#fff;
}

nav a{
  color:#fff;
  text-decoration:none;
  margin-left:15px;
  font-size:13px;
}

nav a:hover{
  color:#ff8fbd;
}

/* HERO */
.hero{
  min-height:100vh;
  padding:120px 20px 70px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    radial-gradient(circle at 50% 20%,#702b4b 0%,transparent 35%),
    linear-gradient(145deg,#160b12,#351020,#12090e);
  position:relative;
}

.sparkle{
  position:absolute;
  color:#ff9fc6;
  font-size:25px;
  animation:float 3s infinite ease-in-out;
}

.s1{top:18%;left:15%}
.s2{top:28%;right:12%;animation-delay:1s}
.s3{bottom:20%;left:20%;animation-delay:2s}
.s4{bottom:28%;right:18%;animation-delay:.5s}

@keyframes float{
  0%,100%{transform:translateY(0) rotate(0deg);opacity:.5}
  50%{transform:translateY(-15px) rotate(15deg);opacity:1}
}

.cat{
  font-size:90px;
  margin-bottom:10px;
  animation:cat 3s infinite ease-in-out;
}

@keyframes cat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

.hero h1{
  font-size:clamp(38px,9vw,72px);
  color:#ff9fc6;
  text-shadow:0 0 25px rgba(255,100,170,.35);
  margin-bottom:8px;
}

.hero h2{
  font-size:20px;
  letter-spacing:3px;
  margin-bottom:18px;
}

.hero p{
  max-width:600px;
  margin:auto;
  color:#f5cddd;
  line-height:1.8;
}

.btn{
  display:inline-block;
  margin-top:28px;
  padding:13px 27px;
  border-radius:30px;
  background:#ff6fae;
  color:#fff;
  text-decoration:none;
  font-weight:bold;
  box-shadow:0 8px 25px rgba(255,80,150,.3);
  transition:.3s;
}

.btn:hover{
  transform:translateY(-4px);
  background:#ff8fbd;
}

/* SECTIONS */
section{
  padding:80px 20px;
}

.section-title{
  text-align:center;
  margin-bottom:45px;
}

.section-title .mini{
  color:#ff83b7;
  font-size:14px;
  letter-spacing:3px;
}

.section-title h2{
  font-size:34px;
  margin-top:8px;
}

.section-title p{
  color:#d9aabd;
  margin-top:10px;
}

/* ABOUT */
.about{
  background:#1b0e15;
}

.about-box{
  max-width:900px;
  margin:auto;
  padding:35px;
  border:1px solid #633149;
  border-radius:25px;
  background:linear-gradient(145deg,#25121c,#160c12);
  text-align:center;
}

.about-box p{
  color:#e9c5d5;
  line-height:2;
}

/* MENU */
.menu{
  background:#120a0f;
}

.menu-grid{
  max-width:1000px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:20px;
}

.card{
  background:linear-gradient(145deg,#29131e,#180c12);
  border:1px solid #603148;
  border-radius:22px;
  padding:25px;
  transition:.3s;
  position:relative;
  overflow:hidden;
}

.card:hover{
  transform:translateY(-7px);
  border-color:#ff75ae;
  box-shadow:0 15px 35px rgba(255,80,150,.15);
}

.card-icon{
  font-size:45px;
  margin-bottom:12px;
}

.card h3{
  color:#ff9fc6;
  margin-bottom:10px;
}

.card p{
  color:#cfaaba;
  font-size:14px;
  line-height:1.7;
}

.price{
  margin-top:16px;
  color:#fff;
  font-weight:bold;
  font-size:18px;
}

/* STAFF */
.staff{
  background:#1b0e15;
}

.staff-grid{
  max-width:900px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:18px;
}

.staff-card{
  text-align:center;
  padding:25px;
  border-radius:20px;
  background:#25121c;
  border:1px solid #593047;
}

.staff-icon{
  width:75px;
  height:75px;
  margin:0 auto 15px;
  border-radius:50%;
  background:#ff77af;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
}

.staff-card h3{
  color:#fff;
}

.staff-card p{
  color:#d29db4;
  margin-top:6px;
}

/* INFO */
.info{
  background:#120a0f;
}

.info-box{
  max-width:850px;
  margin:auto;
  display:grid;
  gap:15px;
}

.info-item{
  padding:20px;
  border-radius:18px;
  background:#21101a;
  border:1px solid #543047;
}

  color:#
